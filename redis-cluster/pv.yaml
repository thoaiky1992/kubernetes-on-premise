apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-redis-data-cp1}
    spec: &redis-data-pv-spec
      capacity: {storage: 20Gi}
      volumeMode: Filesystem
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: local-redis-data
      local: {path: /srv/k8s-local/redis-data}
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - cp1
