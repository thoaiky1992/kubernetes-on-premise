apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-redisinsight-cp1
spec:
  capacity: {storage: 5Gi}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-redisinsight
  local: {path: /srv/k8s-local/redisinsight}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cp1
