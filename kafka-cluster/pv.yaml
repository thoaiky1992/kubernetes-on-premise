apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-kafka-cp1}
    spec: &kafka-pv-spec
      capacity: {storage: 20Gi}
      volumeMode: Filesystem
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: local-kafka
      local: {path: /srv/k8s-local/kafka}
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - cp1
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-kafka-cp2}
    spec:
      <<: *kafka-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - cp2
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-kafka-cp3}
    spec:
      <<: *kafka-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - cp3
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-kafka-wk1}
    spec:
      <<: *kafka-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - wk1
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-kafka-wk2}
    spec:
      <<: *kafka-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - wk2
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-kafka-wk3}
    spec:
      <<: *kafka-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - wk3
