apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: local-elasticsearch-cp1
    spec: &elasticsearch-pv-spec
      capacity: {storage: 20Gi}
      volumeMode: Filesystem
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: local-elasticsearch
      local: {path: /srv/k8s-local/elasticsearch}
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - cp1
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-elasticsearch-cp2}
    spec:
      <<: *elasticsearch-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - cp2
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-elasticsearch-cp3}
    spec:
      <<: *elasticsearch-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - cp3
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-elasticsearch-wk1}
    spec:
      <<: *elasticsearch-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - wk1
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-elasticsearch-wk2}
    spec:
      <<: *elasticsearch-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - wk2
  - apiVersion: v1
    kind: PersistentVolume
    metadata: {name: local-elasticsearch-wk3}
    spec:
      <<: *elasticsearch-pv-spec
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - wk3
